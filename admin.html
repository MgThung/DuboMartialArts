  <script>
        bindUserData();
    
  function validatePhone(phone) {
  // Remove any whitespace from the input
  phone = phone.trim();
  
  // Check if the input is a valid integer
  if (!/^\d+$/.test(phone)) {
    return false;
  }

  // Check if the input has exactly 11 digits
  if (phone.length !== 11) {
    return false;
  }

  return true;
}
    function addUserDataToLocalStorage(userObj) {
      //already has data in localstorage then update it other create new one
      var users = JSON.parse(localStorage.getItem('userData'));
      if (users != null) {
        users.push(userObj);
        localStorage.setItem('userData', JSON.stringify(users));
      } else {
        var userData = new Array();
        userData.push(userObj);
        localStorage.setItem('userData', JSON.stringify(userData));
      }
    }

    function updateDataToLocalStorage(userObj) {
      var users = JSON.parse(localStorage.getItem('userData'));
      if (users != null) {
        var user = users.find((x) => x.userId == userObj.userId);
        if (user != null) {
          user.name = userObj.name;
          user.email = userObj.email;
          user.phone = userObj.phone;
          user.gender = userObj.gender;
          user.address = userObj.address;
          user.membership = userObj.membership;
        }
        localStorage.setItem('userData', JSON.stringify(users));
      }
    }

    function deletedataFromLocalStorage(UserId) {
      var users = JSON.parse(localStorage.getItem('userData'));
      if (users != null) {
        users.splice(users.findIndex(a => a.id === UserId), 1)
        localStorage.setItem('userData', JSON.stringify(users));
      }
    }

    function bindUserData() {
      var users = JSON.parse(localStorage.getItem('userData'));
      // [{},{},{}]
      // {}
      if (users != null) {
        document.getElementById('tbody').innerHTML = "";
        users.forEach(function (item, index) {
          debugger;

          var btnEditId = "btnedit" + item.id;
          var btnDeleteId = "btndelete" + item.id;
          var tableRow = "<tr Id='" + item.id + "' data-CustomerID='" + item.id + "' data-name='" + item.name +
            "' data-email='" + item.email + "' data-phone='" + item.phone + "' data-gender='" + item.gender +
            "' data-address='" + item.address + "' data-membership='" + item.membership + "'>" +
            "<td class='td-data'>" + item.id + "</td>" +
            "<td class='td-data'>" + item.name + "</td>" +
            "<td class='td-data'>" + item.email + "</td>" +
            "<td class='td-data'>" + item.phone + "</td>" +
            "<td class='td-data'>" + item.gender + "</td>" +
            "<td class='td-data'>" + item.address + "</td>" +
            "<td class='td-data'>" + item.membership + "</td>" +
            "<td class='td-data'>" +
              "<div class='tdbtn'>"+
                "<button id='" + btnEditId + "' class='btn btn-info btn-xs btn-editcustomer' onclick='showEditRow(" + item.id + ")'><i class='fa fa-pencil' aria-hidden='true'></i> </button>" +
                " "+
                "<button id='" + btnDeleteId + "' class='btn btn-danger btn-xs btn-deleteCustomer' onclick='deleteRow(" + item.id + ")'><i class='fa fa-trash' aria-hidden='true'> </button>" +
              "</div>"
            "</td>" +
            "</tr>";
          document.getElementById('tbody').innerHTML += tableRow;
        })
      }
      var AddRow = "<tr>" +
        "<td class='td-data'></td>" +
        "<td class='td-data'><input type='text' id='txtname' placeholder='Name...'></td>" +
        "<td class='td-data'><input type='email' id='txtemail' placeholder='Email...'></td>" +
        "<td class='td-data'><input type='phone' id='txtphone' placeholder='Phone Number...'></td>" +
        "<td class='td-data'><select id='ddlgender'><option value='male'>male</option><option value='female'>female</option></select></td>" +
        "<td class='td-data'><input type='text' id='txtaddress' placeholder='Address...'></td>" +
        "<td class='td-data'><select id='txtmembership'><option value='Beginner'>Beginner</option><option value='Intermediate'>Intermediate</option><option value='Elite'>Elite</option><option value='Advance'>Advance</option><option value='Junior Membership'>Junior Membership</option></select></td>" +
        "<td class='td-data'>" + "<button id='btnaddCustomer' onclick='addUser()' class='btn btn-success'> <i class='fa fa-plus-circle' aria-hidden='true'></i> ADD</button>" + "</td>" +
        "</tr>";
      document.getElementById('tbody').innerHTML += AddRow;
    }


    function GetUserID() {
        const ID = Date.now();
        return ID;
    }


    function addUser() {
      var userId = GetUserID();
      var name = document.getElementById("txtname").value;
      if (!name) {
        alert('Please enter name!')
        return false;
      }
      var email = document.getElementById("txtemail").value;
      if (!email) {
        alert('Please enter email!')
        return false;
      }
      var emailfilter = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
      if (!emailfilter.test(email)) {
        alert('Please enter a valid email address!');
        return false;
      }
      var phone = document.getElementById("txtphone").value;

      if (!phone) {
        alert('Please enter phone number!');
        return false;
      } else if (!validatePhone(phone)) {
        alert('Please enter a valid phone number!');
        return false;
      }

      var address = document.getElementById("txtaddress").value;
      if (!address) {
        alert('Please enter an address!')
        return false;
      }

      var gender = document.getElementById("ddlgender").value;

      var membership = document.getElementById("txtmembership").value;
      if (!membership) {
        alert('Please enter membership')
        return false;
      }

      var userObj = {
        "id": userId,
        "name": name,
        "email": email,
        "phone": phone,
        "gender": gender,
        "address": address,
        "membership": membership,
      };
      addUserDataToLocalStorage(userObj);
      document.getElementById('txtname').value = "";
      document.getElementById('txtemail').value = "";
      document.getElementById('txtphone').value = "";
      document.getElementById('txtaddress').value = "";
      document.getElementById('txtmembership').value = "";

      bindUserData();
    }

    function showEditRow(UserID) {
      var userRow = document.getElementById(UserID); //this gives tr of  whose button was clicked
      var trdata = userRow.querySelectorAll(".td-data");
      /*returns array of all elements with
      "row-data" class within the row with given id*/
      var userID = trdata[0].innerHTML;
      var userName = trdata[1].innerHTML;
      var useremail = trdata[2].innerHTML;
      var userPhone = trdata[3].innerHTML;
      var userGender = trdata[4].innerHTML;
      var userAddress = trdata[5].innerHTML;
      var usermembership = trdata[6].innerHTML;

      trdata[0].innerHTML = '<input name="txtuserid"  disabled id="txtuserid" value="' + userID + '"/>';
      trdata[1].innerHTML = '<input name="txtname" id="txtname" value="' + userName + '"/>';
      trdata[2].innerHTML = '<input name="txtemail" id="txtemail" value="' + useremail + '"/>';
      trdata[3].innerHTML = '<input name="txtphone" id="txtphone" value="' + userPhone + '"/>';

      if (userGender == 'male') {
        trdata[4].innerHTML = '<select id="ddlgender"><option value="male">male</option><option value="female">female</option></select>';
      } else {
        trdata[4].innerHTML = '<select id="ddlgender"><option value="female">female</option><option value="male">male</option></select>';
      }
      trdata[5].innerHTML = '<input name="txtaddress" id="txtaddress" value="' + userAddress + '"/>';
      trdata[6].innerHTML = '<input name="txtmembership" id="txtmembership" value="' + usermembership + '"/>';

      trdata[7].innerHTML = 
      "<div class='tdbtnupdate'>"+
        "<button class='btn btn-primary btn-xs btn-updateCustomer updatebtn' onclick='updateUser(" + userID + ")'>" +
        "<i class='fa fa-pencil' aria-hidden='true'></i></button>" +
        "<button class='btn btn-warning btn-xs btn-cancelupdate updatebtn' onclick='cancel(" + userID + ")'><i class='fa fa-times' aria-hidden='true'></i></button>" +
        "<button class='btn btn-danger btn-xs btn-deleteCustomer updatebtn' onclick='deleteUser(" + userID + ")'>" +
        "<i class='fa fa-trash' aria-hidden='true'></i></button>"+
      "</div>"

    }

    function cancel(UserID) {
      var btneditId = "btnedit" + UserID;
      var btndeleteId = "btndelete" + UserID;

      var CustomerRow = document.getElementById(UserID); //this gives tr of  whose button was clicked
      var data = CustomerRow.querySelectorAll(".td-data");

      var name = CustomerRow.getAttribute("data-name");
      var email = CustomerRow.getAttribute("data-email");
      var phone = CustomerRow.getAttribute("data-phone");
      var gender = CustomerRow.getAttribute("data-gender");
      var address = CustomerRow.getAttribute("data-address");
      var membership = CustomerRow.getAttribute("data-membership");

      data[0].innerHTML = UserID;
      data[1].innerHTML = name;
      data[2].innerHTML = email;
      data[3].innerHTML = phone;
      data[4].innerHTML = gender;
      data[5].innerHTML = address;
      data[6].innerHTML = membership;
      var actionbtn =  "<div class='tdbtn'>"+
        "<button id='" + btneditId + "' class='btn btn-info btn-xs btn-editcustomer' onclick='showEditRow(" + UserID + ")'><i class='fa fa-pencil' aria-hidden='true'></i></button>" +
        "<button id='" + btndeleteId + "' class='btn btn-danger btn-xs btn-deleteCustomer' onclick='deleteRow(" + UserID + ")'><i class='fa fa-trash' aria-hidden='true'></button>"+
          "</div>"
      data[7].innerHTML = actionbtn;
    }

    function updateUser(UserID) {
      var userRow = document.getElementById(UserID); //this gives tr of  whose button was clicked
      var data = userRow.querySelectorAll(".td-data");
      var userId = data[0].querySelector("#txtuserid").value;
      var name = data[1].querySelector("#txtname").value;
      var email = data[2].querySelector("#txtemail").value;
      var phone = data[3].querySelector("#txtphone").value;
      var gender = data[4].querySelector("#ddlgender").value;
      var address = data[5].querySelector("#txtaddress").value;
      var membership = data[6].querySelector("#txtmembership").value;
      var userObj = {
        "id": userId,
        "name": name,
        "email": email,
        "phone": phone,
        "gender": gender,
        "address": address,
        "membership": membership,
      };
      updateDataToLocalStorage(userObj);
      bindUserData();
    }

    function deleteRow(UserID) {
      deletedataFromLocalStorage(UserID);
      bindUserData();
    }

  </script>
